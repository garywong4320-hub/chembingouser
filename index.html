<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS AGM Bingo — Team</title>
<style>
  :root{
    --forest:#7c8fc4;
    --forest-deep:#5f78ad;
    --bg:#a9b7dd;
    --cream:#fdfaf3;
    --pink:#f3b6c9;
    --yellow:#f5df5a;
    --ink:#26314f;
    --pending:#f0a94e;
    --approved:#5a9e6f;
    --redo:#d9645f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--cream);
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}
  h1{
    font-size:1.6rem;
    letter-spacing:0.5px;
    color:var(--yellow);
    text-align:center;
    margin:6px 0 2px;
    font-weight:800;
  }
  .sub{text-align:center;color:var(--cream);font-size:0.85rem;margin-bottom:22px;font-weight:600;}
  .card{
    background:var(--cream);
    color:var(--ink);
    border-radius:14px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
  }
  .btn{
    display:block;
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    margin-top:10px;
    background:var(--forest);
    color:var(--cream);
  }
  .btn:disabled{opacity:0.6;cursor:default;}
  .btn.secondary{background:var(--pink);color:var(--ink);}
  input[type=text]{
    width:100%;padding:12px;border-radius:8px;border:2px solid var(--forest);
    font-size:1rem;margin-top:6px;
  }
  label{font-weight:700;font-size:0.9rem;}
  .team-list-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 12px;border-radius:8px;background:#fff;margin-top:8px;
    border:2px solid transparent;cursor:pointer;
  }
  .team-list-item:hover{border-color:var(--forest);}
  .grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
    margin-top:14px;
  }
  .tile{
    aspect-ratio:1/1;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:0.62rem;
    line-height:1.15;
    padding:5px;
    font-weight:700;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    color:#fff;
    background:#8a8a8a;
    border:2px solid rgba(0,0,0,0.1);
  }
  .tile.free{background:var(--pink);color:var(--ink);}
  .tile.pending{background:var(--pending);}
  .tile.approved{background:var(--approved);}
  .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.35;}
  .tile span{position:relative;z-index:1;}
  .badge{
    position:absolute;top:3px;right:4px;font-size:0.9rem;z-index:2;
  }
  .top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .top-nav button{background:none;border:none;color:var(--cream);font-weight:700;cursor:pointer;font-size:0.9rem;}
  .legend{display:flex;gap:14px;font-size:0.75rem;margin-top:10px;flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:5px;}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block;}
  .warn{font-size:0.8rem;color:#a33;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxn_ZMYj-O_z-JOvXQpuel6uVaOG3zFGl3O2KAPuG70vYyyxk8sQZ9FQaTa8erwckNF/exec";

const TASKS = [
  "Recreate this pose (see reference bingo card)",
  "A photo with your department head",
  "\"Erm AcTuAlLY\" pose",
  "A photo with someone from a diff department from you",
  "A photo with a new friend you met today",
  "Take a group photo doing a funny pose",
  "Take a photo with someone who has the same hobby as you",
  "Recreate this pose (see reference bingo card)",
  "Take photo with someone and do \"67\" pose",
  "Recreate this pose (see reference bingo card)",
  "Take a photo with someone that is at least 1.8m tall",
  "Recreate this pose (see reference bingo card)",
  "FREE SPACE",
  "Recreate this pose (see reference bingo card)",
  "\"Scuba\" pose",
  "Eating together",
  "Recreate this pose (see reference bingo card)",
  "Recreate this pose (see reference bingo card)",
  "Is wearing the same colored outfit as you",
  "Take a photo with someone you met in Chem Camp",
  "Recreate this pose (see reference bingo card)",
  "Photo with your favourite element",
  "Photo with someone from the EXCO team",
  "Take a photo forming a heart shape as a group",
  "Recreate this pose (see reference bingo card)"
];
const FREE_INDEX = 12;

const app = document.getElementById('app');
const urlParams = new URLSearchParams(window.location.search);
const savedTeam = urlParams.get('team');
let state = savedTeam
  ? { view: 'team-play', teamName: savedTeam, hasFetchedOnce: false, bingoShown: false }
  : { view: 'team-select', teamName: null, hasFetchedOnce: false, bingoShown: false };

function sleep_(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

async function callApi(action, payload, maxRetries){
  payload = payload || {};
  maxRetries = maxRetries == null ? 4 : maxRetries;
  for (let attempt = 0; attempt <= maxRetries; attempt++){
    try{
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'cors',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action }, payload))
      });
      const json = await res.json();
      if (json && json.error === 'busy' && attempt < maxRetries){
        const base = Math.min(1000 * Math.pow(2, attempt), 8000);
        await sleep_(base / 2 + Math.random() * base / 2);
        continue;
      }
      return json;
    }catch(e){
      if (attempt < maxRetries){
        const base = Math.min(1000 * Math.pow(2, attempt), 8000);
        await sleep_(base / 2 + Math.random() * base / 2);
        continue;
      }
      console.error('API call failed after retries', action, e);
      return { error: 'network' };
    }
  }
}

function urlConfigured(){
  return APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf('PASTE_') === -1;
}

function render(){
  if (!urlConfigured()){
    app.innerHTML = `
      <h1>CSS AGM Bingo</h1>
      <div class="card">
        <p><strong>Setup needed:</strong> this page isn't connected to your Google Sheet yet.</p>
        <p class="warn">Open this file, replace APPS_SCRIPT_URL near the top with your Apps Script Web App URL, and re-publish.</p>
      </div>`;
    return;
  }
  if (state.view === 'team-select') return renderTeamSelect();
  if (state.view === 'team-play') return renderTeamPlay();
}

async function renderTeamSelect(){
  app.innerHTML = `
    <h1>CSS AGM Bingo</h1>
    <div class="sub">AY26/27 AGM 1 Edition</div>
    <div class="card">
      <label>Enter your name</label>
      <input type="text" id="newTeamInput" placeholder="e.g. John Tan">
      <button class="btn" id="createBtn">Start / Continue</button>
      <p id="existingLabel" style="margin:14px 0 0 0;font-weight:700;display:none;">Or select your name:</p>
      <div id="teamList"></div>
    </div>
  `;
  const teams = await callApi('listTeams');
  if (Array.isArray(teams) && teams.length){
    document.getElementById('existingLabel').style.display = 'block';
    const listEl = document.getElementById('teamList');
    teams.forEach(t => {
      const div = document.createElement('div');
      div.className = 'team-list-item';
      div.innerHTML = `<span>${t}</span><span>&rarr;</span>`;
      div.onclick = () => {
        state.teamName = t; state.view = 'team-play';
        history.replaceState(null, '', '?team=' + encodeURIComponent(t));
        render();
      };
      listEl.appendChild(div);
    });
  }
  document.getElementById('createBtn').onclick = async () => {
    const val = document.getElementById('newTeamInput').value.trim();
    if (!val) return;
    const btn = document.getElementById('createBtn');
    btn.disabled = true; btn.textContent = 'Joining...';
    await callApi('createTeam', { teamName: val });
    state.teamName = val; state.view = 'team-play';
    history.replaceState(null, '', '?team=' + encodeURIComponent(val));
    render();
  };
}

async function renderTeamPlay(){
  app.innerHTML = `<div class="card"><p>Loading ${state.teamName}'s board...</p></div>`;
  const data = await callApi('getTeam', { teamName: state.teamName });
  const tiles = (data && data.tiles) ? data.tiles : {};
  tiles[FREE_INDEX] = { status: 'approved', photoUrl: null };
  const approvedCount = Object.values(tiles).filter(t => t.status === 'approved').length;

  app.innerHTML = `
    <div class="top-nav"><button id="back">&larr; Switch team</button><span>${approvedCount}/25 approved</span></div>
    <h1>${state.teamName}</h1>
    <div class="sub" id="elapsedLabel">Tap a tile to snap &amp; submit a photo</div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="dot" style="background:#8a8a8a"></i>Not done</span>
      <span><i class="dot" style="background:var(--pending)"></i>Pending review</span>
      <span><i class="dot" style="background:var(--approved)"></i>Approved</span>
    </div>
    <input type="file" accept="image/*" capture="environment" id="cameraInput" style="display:none">
    <input type="file" accept="image/*" id="galleryInput" style="display:none">
    <div id="pickerOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:10;align-items:flex-end;justify-content:center;">
      <div style="background:var(--cream);color:var(--ink);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:18px;">
        <p style="font-weight:800;margin:0 0 10px 0;" id="pickerTaskLabel"></p>
        <button class="btn" id="pickCameraBtn">📷 Take Photo</button>
        <button class="btn secondary" id="pickGalleryBtn">🖼 Choose from Gallery</button>
        <button class="btn" id="pickCancelBtn" style="background:#999;">Cancel</button>
      </div>
    </div>
    <div id="bingoOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:20;align-items:center;justify-content:center;text-align:center;padding:20px;">
      <div style="background:var(--cream);color:var(--ink);border-radius:16px;padding:28px 22px;max-width:420px;">
        <div style="font-size:2.4rem;">🎉</div>
        <h2 style="margin:8px 0 4px;color:var(--forest);">Congrats you finished the bingo!</h2>
        <p style="margin:4px 0 14px;">Thanks for playing!</p>
        <p id="bingoTimeText" style="font-weight:700;font-size:1.1rem;"></p>
        <button class="btn" id="bingoCloseBtn">Nice!</button>
      </div>
    </div>
  `;
  const grid = document.getElementById('grid');
  TASKS.forEach((task, i) => {
    const t = tiles[i];
    const div = document.createElement('div');
    let cls = 'tile';
    if (i === FREE_INDEX) cls += ' free';
    else if (t && t.status === 'pending') cls += ' pending';
    else if (t && t.status === 'approved') cls += ' approved';
    div.className = cls;
    div.innerHTML = `${t && t.photoUrl ? `<img src="${t.photoUrl}">` : ''}<span>${task}</span>${t && t.status==='approved' ? '<span class="badge">✅</span>' : ''}${t && t.status==='pending' ? '<span class="badge">⏳</span>' : ''}`;
    if (i !== FREE_INDEX){
      div.onclick = () => openPicker(i, task, div);
    }
    grid.appendChild(div);
  });
  document.getElementById('back').onclick = () => {
    if (state.elapsedTicker) clearInterval(state.elapsedTicker);
    state.view = 'team-select'; state.teamName = null;
    history.replaceState(null, '', window.location.pathname);
    render();
  };

  if (data && data.startTime){
    const startMs = new Date(data.startTime).getTime();
    updateElapsedLabel(startMs);
    if (state.elapsedTicker) clearInterval(state.elapsedTicker);
    state.elapsedTicker = setInterval(() => updateElapsedLabel(startMs), 1000);
  }

  if (data && data.bingoAchieved){
    if (!state.hasFetchedOnce){
      state.bingoShown = true;
    } else if (!state.bingoShown){
      state.bingoShown = true;
      showBingoPopup(data.bingoSeconds);
    }
  }
  state.hasFetchedOnce = true;

  document.getElementById('bingoCloseBtn').onclick = () => {
    document.getElementById('bingoOverlay').style.display = 'none';
  };
}

function updateElapsedLabel(startMs){
  const label = document.getElementById('elapsedLabel');
  if (!label) return;
  const secs = Math.max(0, Math.floor((Date.now() - startMs) / 1000));
  label.textContent = 'Time elapsed: ' + formatDuration(secs);
}

function formatDuration(totalSeconds){
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  if (h > 0) return `${h}h ${m}m ${s}s`;
  if (m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

function showBingoPopup(seconds){
  const overlay = document.getElementById('bingoOverlay');
  const timeText = document.getElementById('bingoTimeText');
  if (timeText) {
    timeText.textContent = (seconds !== null && seconds !== undefined)
      ? `You completed it in ${formatDuration(seconds)}!`
      : '';
  }
  if (overlay) overlay.style.display = 'flex';
}

function openPicker(tileIndex, taskText, tileDiv){
  const overlay = document.getElementById('pickerOverlay');
  document.getElementById('pickerTaskLabel').textContent = taskText;
  overlay.style.display = 'flex';

  const cameraInput = document.getElementById('cameraInput');
  const galleryInput = document.getElementById('galleryInput');

  const handleFile = (input) => {
    if (!input.files[0]) return;
    overlay.style.display = 'none';
    resizeImage(input.files[0], async (dataUrl) => {
      tileDiv.style.opacity = '0.5';
      const result = await callApi('submitPhoto', { teamName: state.teamName, tileIndex: tileIndex, photoData: dataUrl });
      if (!result || result.error){
        showUploadFailed_(tileDiv, dataUrl, tileIndex);
        return;
      }
      renderTeamPlay();
    });
    input.value = '';
  };

  document.getElementById('pickCameraBtn').onclick = () => {
    cameraInput.onchange = () => handleFile(cameraInput);
    cameraInput.click();
  };
  document.getElementById('pickGalleryBtn').onclick = () => {
    galleryInput.onchange = () => handleFile(galleryInput);
    galleryInput.click();
  };
  document.getElementById('pickCancelBtn').onclick = () => {
    overlay.style.display = 'none';
  };
}

function showUploadFailed_(tileDiv, dataUrl, tileIndex){
  tileDiv.style.opacity = '1';
  tileDiv.style.outline = '3px solid var(--redo)';
  const old = tileDiv.querySelector('.retry-overlay');
  if (old) old.remove();
  const retryBtn = document.createElement('div');
  retryBtn.className = 'retry-overlay';
  retryBtn.textContent = '⚠️ Failed — tap to retry';
  retryBtn.style.cssText = 'position:absolute;inset:0;background:rgba(217,100,95,0.92);color:#fff;font-size:0.6rem;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;z-index:3;';
  tileDiv.appendChild(retryBtn);
  tileDiv.onclick = () => {
    retryBtn.remove();
    tileDiv.style.outline = '';
    tileDiv.style.opacity = '0.5';
    callApi('submitPhoto', { teamName: state.teamName, tileIndex: tileIndex, photoData: dataUrl }).then((r) => {
      if (r && !r.error) renderTeamPlay();
      else showUploadFailed_(tileDiv, dataUrl, tileIndex);
    });
  };
}

function resizeImage(file, cb){
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 480;
      let w = img.width, h = img.height;
      if (w > h && w > maxDim){ h = h * maxDim / w; w = maxDim; }
      else if (h > maxDim){ w = w * maxDim / h; h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.35));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

render();
</script>
</body>
</html>
