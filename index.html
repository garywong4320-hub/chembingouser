<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUS Chem Bingo — Team</title>
<style>
  :root{
    --forest:#1e3a24;
    --forest-deep:#132818;
    --cream:#fdfaf3;
    --pink:#f3b6c9;
    --yellow:#f5df5a;
    --ink:#1b2a1e;
    --pending:#f0a94e;
    --approved:#5a9e6f;
    --redo:#d9645f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--forest);
    color:var(--cream);
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}
  h1{
    font-size:1.6rem;
    letter-spacing:0.5px;
    color:var(--yellow);
    text-align:center;
    margin:6px 0 2px;
    font-weight:800;
  }
  .sub{text-align:center;color:var(--pink);font-size:0.85rem;margin-bottom:22px;font-weight:600;}
  .card{
    background:var(--cream);
    color:var(--ink);
    border-radius:14px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
  }
  .btn{
    display:block;
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    margin-top:10px;
    background:var(--forest);
    color:var(--cream);
  }
  .btn:disabled{opacity:0.6;cursor:default;}
  .btn.secondary{background:var(--pink);color:var(--ink);}
  input[type=text]{
    width:100%;padding:12px;border-radius:8px;border:2px solid var(--forest);
    font-size:1rem;margin-top:6px;
  }
  label{font-weight:700;font-size:0.9rem;}
  .team-list-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 12px;border-radius:8px;background:#fff;margin-top:8px;
    border:2px solid transparent;cursor:pointer;
  }
  .team-list-item:hover{border-color:var(--forest);}
  .grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
    margin-top:14px;
  }
  .tile{
    aspect-ratio:1/1;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:0.62rem;
    line-height:1.15;
    padding:5px;
    font-weight:700;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    color:#fff;
    background:#8a8a8a;
    border:2px solid rgba(0,0,0,0.1);
  }
  .tile.free{background:var(--pink);color:var(--ink);}
  .tile.pending{background:var(--pending);}
  .tile.approved{background:var(--approved);}
  .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.35;}
  .tile span{position:relative;z-index:1;}
  .badge{
    position:absolute;top:3px;right:4px;font-size:0.9rem;z-index:2;
  }
  .top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .top-nav button{background:none;border:none;color:var(--pink);font-weight:700;cursor:pointer;font-size:0.9rem;}
  .legend{display:flex;gap:14px;font-size:0.75rem;margin-top:10px;flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:5px;}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block;}
  .warn{font-size:0.8rem;color:#a33;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// PASTE your Apps Script Web App URL here (see AppsScript-Backend.gs setup steps)
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxe0qcs63ynGIQYnI13dgndPatQuTUPTa525H2T5wtjeFm0lD6pd_OdN2LS9yQB1LeU/exec";

const TASKS = [
  "A photo with someone you met since Y1SI",
  "A photo with the event IC",
  "\"Um AcTuAlLY\" pose",
  "A photo with a non-graduating person",
  "Take a photo doing a group cheer, like the last lab session just ended",
  "Take a group photo doing a funny pose",
  "Recreate your \"finally graduating\" pose",
  "Take a photo with someone who sat near you in your first-ever Chem lecture",
  "Take a photo recreating your best 'freshman orientation' face vs. now",
  "A photo with someone of the same age",
  "Take a photo doing a group toast to graduation",
  "Recreate this pose (see reference bingo card)",
  "FREE SPACE",
  "Recreate this pose (see reference bingo card)",
  "A photo with a new friend you met today",
  "Take a photo hugging a friend goodbye (dramatically)",
  "Recreate this pose (see reference bingo card)",
  "A photo with a faculty member",
  "Eating together",
  "Is wearing the same colored outfit as you",
  "Recreate this pose (see reference bingo card)",
  "Photo with someone whose age matches proton number 26",
  "Take a photo forming a heart shape as a group",
  "Recreate this pose (see reference bingo card)",
  "Take a group photo forming your graduating year (e.g. '2026') with your bodies/hands"
];
const FREE_INDEX = 12;

const app = document.getElementById('app');
let state = { view: 'team-select', teamName: null };

async function callApi(action, payload){
  payload = payload || {};
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(Object.assign({ action: action }, payload))
    });
    return await res.json();
  }catch(e){
    console.error('API call failed', e);
    return { error: 'network' };
  }
}

function urlConfigured(){
  return APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf('PASTE_') === -1;
}

function render(){
  if (!urlConfigured()){
    app.innerHTML = `
      <h1>NUS Chem Bingo</h1>
      <div class="card">
        <p><strong>Setup needed:</strong> this page isn't connected to your Google Sheet yet.</p>
        <p class="warn">Open this file, replace APPS_SCRIPT_URL near the top with your Apps Script Web App URL, and re-publish.</p>
      </div>`;
    return;
  }
  if (state.view === 'team-select') return renderTeamSelect();
  if (state.view === 'team-play') return renderTeamPlay();
}

async function renderTeamSelect(){
  app.innerHTML = `
    <h1>NUS Chem Bingo</h1>
    <div class="sub">Homecoming Lunch Edition</div>
    <div class="card">
      <label>Enter a new team name</label>
      <input type="text" id="newTeamInput" placeholder="e.g. Team Beaker">
      <button class="btn" id="createBtn">Start / Continue</button>
      <p id="existingLabel" style="margin:14px 0 0 0;font-weight:700;display:none;">Or select existing team:</p>
      <div id="teamList"></div>
    </div>
  `;
  const teams = await callApi('listTeams');
  if (Array.isArray(teams) && teams.length){
    document.getElementById('existingLabel').style.display = 'block';
    const listEl = document.getElementById('teamList');
    teams.forEach(t => {
      const div = document.createElement('div');
      div.className = 'team-list-item';
      div.innerHTML = `<span>${t}</span><span>&rarr;</span>`;
      div.onclick = () => { state.teamName = t; state.view = 'team-play'; render(); };
      listEl.appendChild(div);
    });
  }
  document.getElementById('createBtn').onclick = async () => {
    const val = document.getElementById('newTeamInput').value.trim();
    if (!val) return;
    const btn = document.getElementById('createBtn');
    btn.disabled = true; btn.textContent = 'Joining...';
    await callApi('createTeam', { teamName: val });
    state.teamName = val; state.view = 'team-play'; render();
  };
}

async function renderTeamPlay(){
  app.innerHTML = `<div class="card"><p>Loading ${state.teamName}'s board...</p></div>`;
  const data = await callApi('getTeam', { teamName: state.teamName });
  const tiles = (data && data.tiles) ? data.tiles : {};
  tiles[FREE_INDEX] = { status: 'approved', photoUrl: null };
  const approvedCount = Object.values(tiles).filter(t => t.status === 'approved').length;

  app.innerHTML = `
    <div class="top-nav"><button id="back">&larr; Switch team</button><span>${approvedCount}/25 approved</span></div>
    <h1>${state.teamName}</h1>
    <div class="sub">Tap a tile to snap &amp; submit a photo</div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="dot" style="background:#8a8a8a"></i>Not done</span>
      <span><i class="dot" style="background:var(--pending)"></i>Pending review</span>
      <span><i class="dot" style="background:var(--approved)"></i>Approved</span>
    </div>
    <input type="file" accept="image/*" capture="environment" id="fileInput" style="display:none">
  `;
  const grid = document.getElementById('grid');
  TASKS.forEach((task, i) => {
    const t = tiles[i];
    const div = document.createElement('div');
    let cls = 'tile';
    if (i === FREE_INDEX) cls += ' free';
    else if (t && t.status === 'pending') cls += ' pending';
    else if (t && t.status === 'approved') cls += ' approved';
    div.className = cls;
    div.innerHTML = `${t && t.photoUrl ? `<img src="${t.photoUrl}">` : ''}<span>${task}</span>${t && t.status==='approved' ? '<span class="badge">✅</span>' : ''}${t && t.status==='pending' ? '<span class="badge">⏳</span>' : ''}`;
    if (i !== FREE_INDEX){
      div.onclick = () => {
        const input = document.getElementById('fileInput');
        input.onchange = () => {
          if (!input.files[0]) return;
          resizeImage(input.files[0], async (dataUrl) => {
            div.style.opacity = '0.5';
            await callApi('submitPhoto', { teamName: state.teamName, tileIndex: i, photoData: dataUrl });
            renderTeamPlay();
          });
          input.value = '';
        };
        input.click();
      };
    }
    grid.appendChild(div);
  });
  document.getElementById('back').onclick = () => { state.view = 'team-select'; render(); };
}

function resizeImage(file, cb){
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 640;
      let w = img.width, h = img.height;
      if (w > h && w > maxDim){ h = h * maxDim / w; w = maxDim; }
      else if (h > maxDim){ w = w * maxDim / h; h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.55));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

render();
</script>
</body>
</html>
